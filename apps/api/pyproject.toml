[project]
name = "medgemma-api"
version = "0.1.0"
description = "MedGemma FastAPI backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "alembic>=1.13.0",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "minio>=7.2.5",
    "boto3>=1.34.0",
    "sentence-transformers>=2.6.0",
    "pypdfium2>=4.30.0",
    "pdfplumber>=0.11.4",
    "rapidocr-onnxruntime>=1.3.24",
    "pillow>=10.4.0",
    "numpy>=1.26.4",
    "python-dateutil>=2.9.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.9",
    "pydicom>=3.0.0",
    "reportlab>=4.2.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

