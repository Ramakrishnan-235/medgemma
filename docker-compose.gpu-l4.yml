services:
  gpu-service:
    build:
      context: ./apps/gpu-service
      dockerfile: Dockerfile.l4.vllm
    container_name: medgemma-gpu-l4
    restart: unless-stopped
    shm_size: "8gb"
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      LAUNCH_MODE: telemetry_gateway
      MEDGEMMA_CHECKPOINT: google/medgemma-1.5-4b-it
      MEDGEMMA_MAX_CONCURRENCY: "4"
      MEDGEMMA_MAX_QUEUE_DEPTH: "16"
      VLLM_MAX_MODEL_LEN: "65536"
      VLLM_GPU_MEMORY_UTILIZATION: "0.90"
      VLLM_MAX_IMAGES_PER_PROMPT: "128"
      VLLM_GUIDED_DECODING_BACKEND: "xgrammar"
      VLLM_ENABLE_PREFIX_CACHING: "true"
      HF_TOKEN: ${HF_TOKEN}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

