version: "3.8"

services:
  # 1. MedGemma 1.5 Serving Engine (High-throughput VLM server)
  medgemma-engine:
    image: vllm/vllm-openai:latest
    container_name: medgemma-vllm
    ipc: host
    ports:
      - "8001:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      # Cache HuggingFace weights on host so they aren't redownloaded
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      serve google/medgemma-1.5-4b
      --host 0.0.0.0
      --port 8000
      --max-model-len 131072
      --limit-mm-per-prompt '{"image": 64}'
      --trust-remote-code
      --dtype bfloat16
      --gpu-memory-utilization 0.85
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # 2. Medical Backend & DICOM Processing Engine
  ct-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ct-backend-api
    ports:
      - "8000:8000"
    environment:
      - MEDGEMMA_BASE_URL=http://medgemma-engine:8000/v1
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/outputs:/app/data/outputs
    depends_on:
      - medgemma-engine
    restart: unless-stopped
