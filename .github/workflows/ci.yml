name: CI Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ============================================================================
  # 1. FRONTEND: LINT, TYPES, WASM STAGING, 162-TEST E2E SUITE, BUILD, AUDIT
  # ============================================================================
  frontend-quality:
    name: Frontend Quality & E2E Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Stage & Verify Cornerstone3D WASM Codecs
        run: |
          node scripts/copy-cornerstone-wasm.mjs
          test -d public/assets/cs-wasm

      - name: Static Type Check & Lint (Strict tsc)
        run: |
          npm run type-check
          npm run lint

      - name: Run Authoritative E2E Test Suite (162 Tests, Tiers 1-4)
        run: npm run test:e2e

      - name: Next.js Production Build (Client/SSR Boundaries)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Frontend Security Vulnerability Audit
        run: npm audit --audit-level=critical

  # ============================================================================
  # 2. BACKEND UNIT & SYNTAX: COMPILEALL, RUFF, MYPY, 91 REGRESSION TESTS
  # ============================================================================
  backend-unit:
    name: Backend Unit Tests & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv and Setup Python ${{ env.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/pyproject.toml"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Backend & Testing Dependencies via uv
        working-directory: apps/api
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install pytest pytest-asyncio pytest-subtests httpx ruff mypy

      - name: Python Bytecode & Syntax Compilation
        run: |
          uv run python -m compileall src apps/api apps/gpu-service tests

      - name: Ruff Code Quality & Formatting Linter
        working-directory: apps/api
        run: |
          uv run ruff check app tests

      - name: Mypy Static Type Checking
        working-directory: apps/api
        run: |
          uv run mypy app --ignore-missing-imports

      - name: Run Backend Unit & Security Test Suite (91 Tests)
        env:
          PYTHONPATH: apps/api:src
          HF_HUB_OFFLINE: "1"
        run: |
          uv run pytest tests -v --tb=short

  # ============================================================================
  # 3. BACKEND INTEGRATION: POSTGRES PGVECTOR, REDIS, ALEMBIC & ACCEPTANCE GATES
  # ============================================================================
  backend-integration:
    name: Backend Integration, Alembic & pgvector RRF
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: medgemma_test
          POSTGRES_PASSWORD: medgemma_test_password
          POSTGRES_DB: medgemma_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U medgemma_test -d medgemma_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+asyncpg://medgemma_test:medgemma_test_password@localhost:5432/medgemma_test_db
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin_secret
      S3_BUCKET_NAME: clinical-cases-test
      JWKS_URL: http://localhost:3000/api/auth/jwks
      JWT_ISSUER: http://localhost:3000
      JWT_AUDIENCE: medgemma-api
      MEDGEMMA_SERVICE_URL: http://localhost:8080
      MEDGEMMA_MODE: mock_deterministic
      MEDGEMMA_CHECKPOINT: google/medgemma-1.5-4b-it
      MEDGEMMA_PROCESSOR_VERSION: 1.5.0-896px

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Install System Libraries for pypdfium2 and RapidOCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-client \
            libgl1 \
            libglib2.0-0 \
            libgomp1

      - name: Install uv and Setup Python ${{ env.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/pyproject.toml"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache intfloat/e5-small-v2 CPU Weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small-v2-v1

      - name: Install Backend Dependencies via uv
        working-directory: apps/api
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install pytest pytest-asyncio httpx

      - name: Enable pgvector and pgcrypto Extensions
        env:
          PGPASSWORD: medgemma_test_password
        run: |
          psql -h localhost -U medgemma_test -d medgemma_test_db -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U medgemma_test -d medgemma_test_db -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run & Verify Reversible Alembic Migrations (Up -> Down -> Up)
        working-directory: apps/api
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Verify HNSW Vector Index & Generated tsvector GIN Index Exist
        env:
          PGPASSWORD: medgemma_test_password
        run: |
          psql -h localhost -U medgemma_test -d medgemma_test_db -c "\d evidence_chunks" | grep -E "idx_evidence_embedding_hnsw|idx_evidence_chunks_tsv_gin"

      - name: Pre-warm E5-small-v2 CPU Embedder
        working-directory: apps/api
        run: |
          uv run python -c "from app.services.embeddings import get_cpu_embedder; get_cpu_embedder()"

      - name: Run Authoritative Integration & Acceptance Gate Tests
        working-directory: apps/api
        run: |
          uv run pytest tests/ -v --tb=short

  # ============================================================================
  # 4. CONTAINER VERIFICATION: DOCKER COMPOSE & MULTI-CONTAINER BUILDS
  # ============================================================================
  container-verification:
    name: Container & Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.test .env
          docker compose --env-file .env.test config --quiet

      - name: Build Web Container
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: medgemma-web:ci-test

      - name: Build API Container
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: medgemma-api:ci-test
