name: MedGemma Workspace PR CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  MEDGEMMA_MODE: "mock_deterministic"
  MEDGEMMA_CHECKPOINT: "google/medgemma-1.5-4b-it"
  MEDGEMMA_PROCESSOR_VERSION: "1.5.0-896px"

jobs:
  # ============================================================================
  # JOB 1: FastAPI, Alembic Migrations, pgvector + tsvector RRF & Acceptance Suite
  # ============================================================================
  backend-pgvector-ci:
    name: Backend, Alembic & pgvector RRF Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: medgemma_test
          POSTGRES_PASSWORD: medgemma_test_password
          POSTGRES_DB: medgemma_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U medgemma_test -d medgemma_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+asyncpg://medgemma_test:medgemma_test_password@localhost:5432/medgemma_test_db
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin_secret
      S3_BUCKET_NAME: clinical-cases-test
      JWKS_URL: http://localhost:3000/api/auth/jwks
      JWT_ISSUER: http://localhost:3000
      JWT_AUDIENCE: medgemma-api
      MEDGEMMA_SERVICE_URL: http://localhost:8080

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Install System Libraries for pypdfium2 and RapidOCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-client \
            libgl1 \
            libglib2.0-0 \
            libgomp1

      - name: Install uv and Setup Python ${{ env.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/pyproject.toml"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache intfloat/e5-small-v2 CPU Weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small-v2-v1

      - name: Install Backend Dependencies via uv
        working-directory: apps/api
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install pytest pytest-asyncio httpx ruff mypy

      - name: Enable pgvector and pgcrypto Extensions
        env:
          PGPASSWORD: medgemma_test_password
        run: |
          psql -h localhost -U medgemma_test -d medgemma_test_db -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U medgemma_test -d medgemma_test_db -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run & Verify Reversible Alembic Migrations (Up -> Down -> Up)
        working-directory: apps/api
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Verify HNSW Vector Index & Generated tsvector GIN Index Exist
        env:
          PGPASSWORD: medgemma_test_password
        run: |
          psql -h localhost -U medgemma_test -d medgemma_test_db -c "\d evidence_chunks" | grep -E "idx_evidence_embedding_hnsw|idx_evidence_chunks_tsv_gin"

      - name: Lint & Typecheck Backend (Ruff + Mypy)
        working-directory: apps/api
        run: |
          uv run ruff check app tests
          uv run mypy app --ignore-missing-imports

      - name: Pre-warm E5-small-v2 CPU Embedder
        working-directory: apps/api
        run: |
          uv run python -c "from app.services.embeddings import get_cpu_embedder; get_cpu_embedder()"

      - name: Run Hybrid pgvector RRF & MVP Acceptance Gate Tests
        working-directory: apps/api
        run: |
          uv run pytest tests/test_hybrid_rrf_retrieval.py tests/test_mvp_acceptance_gates.py -v --tb=short

  # ============================================================================
  # JOB 2: Next.js App Router, Cornerstone3D WASM Staging & Strict TypeScript
  # ============================================================================
  frontend-typecheck-build:
    name: Next.js Typecheck & SSR Boundary Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Stage & Verify Cornerstone3D Codec WASM Binaries
        working-directory: apps/web
        run: |
          node scripts/copy-cornerstone-wasm.mjs
          test -d public/assets/cs-wasm

      - name: Run Strict TypeScript Compiler Check (tsc --noEmit)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Run Next.js Production Build (Verifies Client/SSR Boundaries)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

