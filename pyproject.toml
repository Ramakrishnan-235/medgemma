[project]
name = "medgemma-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ramakrishnan-235", email = "ramakrishnanti22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "huggingface-hub[cli]>=2.2.0",
    "pillow>=13.0.0",
    "transformers>=4.48.0",
    "torch==2.14.1",
    "fastapi>=0.110.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "redis>=5.0.3",
    "boto3>=1.34.0",
    "pyjwt[crypto]>=2.8.0",
    "greenlet>=3.0.0",
    "pydicom>=3.0.2",
    "celery>=5.3.6",
    "reportlab>=4.2.2",
]

[project.scripts]
medgemma-app = "medgemma_app:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "apps/api"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]
